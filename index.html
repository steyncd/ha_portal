<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22252A" />
    <!-- The 16px is a separate flat-copper drawing, not a scaled favicon.svg:
         the gradient muddies below ~20px and the stroke is drawn at 2px against
         the hexagon's 1px. Declared before the SVG so browsers that prefer a
         sized raster still find it. -->
    <!-- favicon.ico first, and it must EXIST: browsers request /favicon.ico on
         their own, and this is an SPA whose rewrite returns index.html for any
         unknown path — so without a real file the browser got HTML with
         content-type text/html where an icon should be, and fell back to its own
         generic (blue-ish) default. Added 2026-08-11. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Steyn Home</title>
    <script>
      // No-flash theme: set data-theme before first paint (reads the persisted prefs blob).
      // This list MUST track THEMES in prefs.svelte.ts. It was still naming the
      // retired v1 set (aurora/tide/meadow/spectrum), so every cold load stamped
      // data-theme="tide" — a theme app.css no longer defines — and the page
      // painted unthemed until the app booted and corrected it.
      try {
        var ok = ["stone", "basalt", "fog", "slate", "harbour", "ink", "clay", "graphite", "plum"];
        var t = (JSON.parse(localStorage.getItem("ha_portal_prefs") || "{}").theme) || "stone";
        document.documentElement.dataset.theme = ok.indexOf(t) >= 0 ? t : "stone";
      } catch (e) { document.documentElement.dataset.theme = "stone"; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
